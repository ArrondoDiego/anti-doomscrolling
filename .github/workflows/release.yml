name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system dependencies
        run: |
          brew install sdl2 sdl2_mixer ffmpeg pkg-config
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
      - name: Download MediaPipe models
        run: |
          curl -L "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task" -o face_landmarker.task
          curl -L "https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float32/1/efficientdet_lite0.tflite" -o efficientdet_lite0.tflite
      - name: Verify build files
        run: |
          ls -lh
          test -f face_landmarker.task
          test -f efficientdet_lite0.tflite
          test -f video.mp4
      - name: Build macOS app
        run: pyinstaller --clean --noconfirm doomscroll.spec
      - name: Verify app
        run: |
          test -d "dist/Doomscroll.app"
          ls -lah "dist/Doomscroll.app"
      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent "dist/Doomscroll.app" "Doomscroll-macos-arm64.zip"
      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: Doomscroll-macos-arm64
          path: Doomscroll-macos-arm64.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System deps
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libsdl2-mixer-dev ffmpeg pkg-config
      - name: Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
      - name: Download models
        run: |
          curl -L "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task" -o face_landmarker.task
          curl -L "https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float32/1/efficientdet_lite0.tflite" -o efficientdet_lite0.tflite
      - name: Build
        run: pyinstaller --clean --noconfirm doomscroll.spec
      - name: Package
        run: |
          cd dist && tar czf ../Doomscroll-linux.tar.gz Doomscroll && cd ..
          ls -lh *.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: Doomscroll-linux
          path: Doomscroll-linux.tar.gz

  release:
    needs: [build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.{tar.gz,zip}
          generate_release_notes: true
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || format('Automated Build #{0}', github.run_number) }}
          prerelease: ${{ github.ref_type != 'tag' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
